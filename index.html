<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(#1a0f2e,#2a0f1e);color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3.2vw;min-height:100vh;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;padding:calc(env(safe-area-inset-top) + 3vw) 3vw calc(env(safe-area-inset-bottom) + 6vw)}
h1{margin:0;font-size:6.5vw;color:#ff6e40;letter-spacing:.5px}h1 span{color:#ffd600}
#round{font-size:8vw;color:#ffd600;font-weight:700}#round.ready{color:#40c4ff}#round.done{color:#00e676;font-size:11vw}
#time{font-size:24vw;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.card{background:#ffffff12;border-radius:4vw;padding:3vw;width:94vw;display:flex;flex-direction:column;align-items:center;gap:2vw}
.lbl{font-size:4.5vw;color:#ccc}
.row{display:flex;gap:4vw;align-items:center;justify-content:center}
button{border:0;border-radius:4vw;font-size:7vw;font-weight:700;color:#fff;padding:3.5vw 6vw;min-width:22vw}
.adj{background:#3a2a4a;font-size:10vw;padding:1vw 6vw}
.val{font-size:8vw;min-width:28vw;text-align:center;font-variant-numeric:tabular-nums}
#start{background:#00c853;min-width:44vw}#reset{background:#d50000}
.seg{display:flex;border-radius:3vw;overflow:hidden;border:2px solid #555}
.seg button{border-radius:0;background:#222;color:#aaa;font-size:5vw;padding:2vw 4vw;min-width:20vw}
.seg button.on{background:#ff3d00;color:#fff}
#setsval{font-size:10vw;font-weight:700}
#sets{width:84vw;height:9vw;accent-color:#ff3d00}
.small{font-size:5vw;padding:2.5vw 5vw;background:#5e35b1}
#songname{font-size:4vw;color:#ffd600;text-align:center;word-break:break-all}
label{font-size:4.8vw}
</style></head><body>
<h1>⚡ Advanced <span>Training</span> Timer</h1>
<div id="round">Set 1 of 3</div>
<div id="time">1:00</div>
<div class="row"><button id="start">Start</button><button id="reset">Reset</button></div>
<div class="card"><div class="lbl">Work time per set</div>
<div class="row"><button class="adj" id="minus">−</button><div class="val" id="dur">1:00</div><button class="adj" id="plus">+</button></div>
<div class="seg"><button id="s30">30 sec</button><button id="s60">1 min</button></div></div>
<div class="card"><div class="lbl">Sets <span id="setsval">3</span></div><input type="range" id="sets" min="1" max="10" step="1" value="3" aria-label="Number of sets"></div>
<div class="card"><div class="lbl">Get ready before set 1</div>
<div class="row"><button class="adj" id="lminus">−</button><div class="val" id="lead">0:10</div><button class="adj" id="lplus">+</button></div>
<div class="seg"><button id="l5">5 sec</button><button id="l30">30 sec</button><button id="l60">1 min</button></div></div>
<div class="card"><div class="lbl">Alert sound</div>
<div class="seg"><button id="mbeep">Beeps</button><button id="msong">My song</button></div>
<div id="songname">No song chosen (beeps will play)</div>
<div class="row"><button class="small" id="choose">🎵 Choose song</button><button class="small" id="preview">▶ Preview</button></div>
<input type="file" id="file" accept="audio/*" style="display:none">
<button class="small" id="testsnd" style="background:#2962ff">🔊 Test sound</button>
<label><input type="checkbox" id="cd" checked style="transform:scale(1.8);margin-right:3vw">3-2-1 warning beeps</label></div>
<script>
const MAX=1800,LMAX=300;let STEP=30,dur=60,left=60,round=1,sets=3,done=false,running=false,endAt=0,tick=null,lastBeep=-1,ac=null,wl=null;
let LSTEP=5,lead=10,phase='work',fresh=true,mode='beeps',songEl=null,songUrl=null,songTimer=null;window.__snd=[];
const $=id=>document.getElementById(id),fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
/* WAV beeps via HTMLAudioElement (iOS-safe), WebAudio fallback */
function wav(parts){var sr=22050,tot=0;parts.forEach(function(p){tot+=Math.floor(sr*p[1]/1000)});var b=new ArrayBuffer(44+tot*2),v=new DataView(b);
function s(o,t){for(var i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))}
s(0,'RIFF');v.setUint32(4,36+tot*2,true);s(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,tot*2,true);
var o=44;parts.forEach(function(p){var n=Math.floor(sr*p[1]/1000);for(var i=0;i<n;i++){var env=Math.min(1,i/200,(n-i)/200);var x=p[0]?Math.sin(2*Math.PI*p[0]*i/sr)*0.9*env:0;v.setInt16(o,x*32767,true);o+=2}});
var u=new Uint8Array(b),bin='';for(var i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return 'data:audio/wav;base64,'+btoa(bin)}
const PAT={tick:[[800,120]],go:[[1200,400]],set:[[1000,250],[0,100],[1000,250],[0,100],[1400,600]],fin:[[880,160],[0,20],[1100,160],[0,20],[1320,160],[0,20],[1760,1500]]};
const SRC={};for(const k in PAT)SRC[k]=wav(PAT[k]);const A={};let unlocked=false;
function el(k){if(!A[k]){const a=new Audio(SRC[k]);a.preload='auto';a.setAttribute('playsinline','');A[k]=a}return A[k]}
function osc(k){let t=0;PAT[k].forEach(p=>{if(p[0])setTimeout(()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=p[0];o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+p[1]/1000)}catch(e){}},t);t+=p[1]})}
function play(k){__snd.push(k);const a=el(k);a.__want=1;a.onended=()=>{a.__want=0};try{a.pause();a.currentTime=0;a.muted=false;a.volume=1;const p=a.play();if(p&&p.catch)p.catch(()=>osc(k))}catch(e){osc(k)}}
function playSong(){if(!songEl)return false;__snd.push('song');clearTimeout(songTimer);try{songEl.__want=1;songEl.muted=false;songEl.volume=1;songEl.currentTime=0;const p=songEl.play();if(p&&p.catch)p.catch(()=>{})}catch(e){return false}songTimer=setTimeout(()=>{try{songEl.__want=0;songEl.pause()}catch(e){}},5000);return true}
function alertSound(k){if(mode==='song'&&songEl&&playSong())return;play(k)}
function vib(p){if(navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
function unlockAll(){
 try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
 try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume();const bs=ac.createBufferSource();bs.buffer=ac.createBuffer(1,1,22050);bs.connect(ac.destination);bs.start(0)}catch(e){}
 if(songEl&&!songEl.__u&&songEl.paused){songEl.__u=1;songEl.muted=true;try{const p=songEl.play(),f=()=>{songEl.muted=false;if(!songEl.__want){songEl.pause();songEl.currentTime=0}};if(p&&p.then)p.then(f,f);else f()}catch(e){}}
 if(unlocked)return;unlocked=true;
 Object.keys(PAT).forEach(k=>{const a=el(k);a.muted=true;try{const p=a.play(),f=()=>{a.muted=false;if(!a.__want){a.pause();a.currentTime=0}};if(p&&p.then)p.then(f,f);else f()}catch(e){}});}
/* IndexedDB song storage */
function db(){return new Promise((res,rej)=>{const r=indexedDB.open('att',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function saveSong(f){const d=await db();await new Promise((res,rej)=>{const t=d.transaction('s','readwrite');t.objectStore('s').put({blob:f,name:f.name},'song');t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function loadSong(){try{const d=await db();const v=await new Promise(res=>{const r=d.transaction('s').objectStore('s').get('song');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)});if(v&&v.blob)setSong(v.blob,v.name)}catch(e){}}
function setSong(blob,name){if(songUrl)URL.revokeObjectURL(songUrl);songUrl=URL.createObjectURL(blob);songEl=new Audio(songUrl);songEl.preload='auto';songEl.setAttribute('playsinline','');$('songname').textContent='🎵 '+(name||'Song');draw()}
$('choose').onclick=()=>{unlockAll();$('file').click()};
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;setSong(f,f.name);mode='song';save();try{await saveSong(f)}catch(e){}draw();e.target.value=''};
$('preview').onclick=()=>{unlockAll();if(mode==='song'&&songEl)playSong();else play('set')};
$('testsnd').onclick=()=>{unlockAll();setTimeout(()=>play('set'),80)};
$('mbeep').onclick=()=>{mode='beeps';if(songEl){songEl.__want=0;songEl.pause()}save();draw()};$('msong').onclick=()=>{mode='song';save();draw()};
function draw(){const t=done?0:Math.max(0,Math.ceil(left));$('time').textContent=fmt(t);
 const r=$('round');r.textContent=done?'Done!':(phase==='ready'?'Get ready':'Set '+round+' of '+sets);r.className=done?'done':(phase==='ready'?'ready':'');
 $('setsval').textContent=sets;$('sets').value=sets;$('dur').textContent=fmt(dur);$('lead').textContent=fmt(lead);
 $('start').textContent=running?'Pause':'Start';$('start').style.background=running?'#ff6d00':'#00c853';
 $('s30').className=STEP==30?'on':'';$('s60').className=STEP==60?'on':'';[5,30,60].forEach(s=>$('l'+s).className=LSTEP==s?'on':'');
 $('mbeep').className=mode==='beeps'?'on':'';$('msong').className=mode==='song'?'on':'';
 if(!songEl)$('songname').textContent=mode==='song'?'No song chosen yet — beeps will play':'No song chosen';}
function loop(){left=(endAt-Date.now())/1000;const s=Math.ceil(left);
 if($('cd').checked&&s<=3&&s>=1&&s!==lastBeep&&(phase==='ready'||dur>3)){lastBeep=s;play('tick');}
 if(left<=0){lastBeep=-1;
  if(phase==='ready'){phase='work';play('go');vib(300);endAt+=dur*1000;}
  else if(round>=sets){finish();return;}
  else{alertSound('set');vib([400,150,400,150,600]);round++;endAt+=dur*1000;}
  left=(endAt-Date.now())/1000;}
 draw();}
function finish(){running=false;clearInterval(tick);done=true;fresh=true;left=0;lastBeep=-1;if(wl){wl.release();wl=null}alertSound('fin');vib([600,200,600,200,1200]);draw();}
async function lock(){try{if('wakeLock'in navigator)wl=await navigator.wakeLock.request('screen');}catch(e){}}
function start(){if(done){done=false;round=1;}if(fresh){fresh=false;round=1;if(lead>0){phase='ready';left=lead}else{phase='work';left=dur}}
 running=true;endAt=Date.now()+left*1000;tick=setInterval(loop,100);lock();draw();}
function pause(){running=false;clearInterval(tick);left=Math.ceil((endAt-Date.now())/1000);if(wl){wl.release();wl=null}draw();}
$('start').addEventListener('click',()=>{unlockAll();running?pause():start()});
function reset(){if(running)pause();phase='work';fresh=true;left=dur;round=1;done=false;lastBeep=-1;draw()}
$('reset').onclick=reset;
function save(){try{localStorage.setItem('att',JSON.stringify({dur,STEP,sets,lead,LSTEP,mode}))}catch(e){}}
function idle(){return !running&&fresh}
function adj(d){dur=Math.min(MAX,Math.max(STEP,dur+d));if(idle()||phase==='work'&&!running&&fresh)left=dur;save();draw()}
function setStep(st){STEP=st;if(st==60){dur=Math.min(MAX,Math.max(60,Math.round(dur/60)*60))}if(idle())left=dur;save();draw()}
function ladj(d){lead=Math.min(LMAX,Math.max(0,lead+d));save();draw()}
function setLStep(st){LSTEP=st;if(lead%st)lead=Math.min(LMAX,Math.round(lead/st)*st);save();draw()}
$('plus').onclick=()=>adj(STEP);$('minus').onclick=()=>adj(-STEP);$('s30').onclick=()=>setStep(30);$('s60').onclick=()=>setStep(60);
$('lplus').onclick=()=>ladj(LSTEP);$('lminus').onclick=()=>ladj(-LSTEP);[5,30,60].forEach(s=>$('l'+s).onclick=()=>setLStep(s));
$('sets').oninput=e=>{sets=+e.target.value;if(round>sets&&!done)round=sets;save();draw()};
['touchstart','touchend','click'].forEach(e=>document.addEventListener(e,unlockAll,{passive:true,capture:true}));
